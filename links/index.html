<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1E3A2F" />
  <title>Links | Bobaloka Acessórios</title>
  <meta name="description" content="Bobaloka Acessórios — fale conosco, catálogos, linhas e loja." />
  <link rel="icon" href="../assets/icons/marca.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="page">
    <aside class="hero">
      <img id="hero-image" src="../assets/images/loja.jpg" alt="Fachada da loja Bobaloka Acessórios" />
    </aside>

    <main class="panel">
      <div class="panel-inner">
        <header class="brand">
          <h1>
            <img class="logo" src="../assets/images/logo_bobaloka.png" alt="" />
            <span class="sr-only">Bobaloka</span>
          </h1>
          <p class="brand-tag">Acessórios</p>
          <div class="gold-line"></div>
        </header>

        <div class="socials" id="socials"></div>
        <nav aria-label="Links principais" id="buttons"></nav>

        <section class="linhas" aria-label="Nossas linhas">
          <h2>Nossas linhas</h2>
          <div class="mosaic" id="mosaic"></div>
        </section>

        <p class="foot">Bobaloka Acessórios</p>
      </div>
    </main>
  </div>
  <script src="../js/links.js"></script>
</body>
</html>
